name: CI

# Backend : lint (ruff, règles minimales F+E9) + tests (pytest, non-régression
# PDF/Word du Batch 11). Frontend : vérification des types + build de prod.
# Aucun secret Supabase/Anthropic requis — vérifié : les tests n'importent que
# des modèles Pydantic purs et le build Next.js réussit sans variables
# NEXT_PUBLIC_* définies (elles ne sont lues qu'au runtime navigateur, jamais
# pendant la compilation/prerendering).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests (pytest)
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Installer les dépendances
        run: npm ci
      - name: Vérification des types (tsc)
        run: npx tsc --noEmit
      - name: Build de production
        run: npm run build
